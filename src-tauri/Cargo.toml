[package]
name = "libraium"
version = "1.0.0"
description = "LibrAIum — a personal, local-first library of best-practice GitHub repositories"
authors = ["masaoka"]
license = "MIT"
edition = "2021"
# The crate has two bins (libraium + the dump_entries conformance helper);
# `tauri dev` runs a bare `cargo run`, which needs this to stay unambiguous.
default-run = "libraium"

[lib]
name = "libraium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived serde_yaml (same libyaml core, same 0.9 API);
# it backs the parity-critical entry format, so byte-for-byte behavior is pinned
# by scripts/conformance.mjs (parse + serialize + function corpus).
serde_norway = "0.9"
fuzzy-matcher = "0.3"
chrono = "0.4"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
