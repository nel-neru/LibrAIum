name: CI

# No branch filter, deliberately. `branches: [main]` on BOTH triggers meant CI stopped observing
# anything the moment work moved to a work branch - and all of this repository's current work sits
# on one, including the L1 provider and the G0 Windows-conformance fix. The platform is migrating to
# Linux, and this is the repository most exposed to that move (Tauri/Rust needs system packages that
# only exist on the CI image). A leg that only fires on a branch nobody works on proves nothing.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root dependencies
        run: npm ci

      - name: Install mcp-server dependencies
        run: npm ci
        working-directory: mcp-server

      # dist/ must exist before any cargo compile: generate_context! embeds it.
      - name: Build frontend (dist for generate_context!)
        run: npm run build

      # rustfmt runs locally only as a best-effort post-edit hook — enforce it
      # in CI so a contributor (or agent) without that hook cannot merge
      # unformatted Rust.
      - name: Rust format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: Run verification suite
        run: bash scripts/verify-all.sh

  # Build + test on macOS, the primary target platform: this is the only leg
  # that compiles and exercises the OS-keychain integration (keyring crate) and
  # the git-CLI gitops path on macOS/Windows-family code. ubuntu-only CI would
  # ship a keychain or credential-helper regression undetected.
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend (dist for generate_context!)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build the app binary
        run: cargo build --locked --bin libraium
        working-directory: src-tauri

  # Build on Windows: the only leg that compiles the Windows Resource step in
  # tauri-build (which requires icons/icon.ico) and the windows-native keyring
  # backend. A missing .ico or an MSVC-only regression would otherwise ship
  # undetected — ubuntu/macOS never touch the Windows RC path. `--bin libraium`
  # builds bin+rlib only (not the iOS staticlib archive), so it is fast and
  # avoids the antivirus file-lock that a full `tauri build` can hit on Windows.
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend (dist for generate_context!)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build the app binary
        run: cargo build --locked --bin libraium
        working-directory: src-tauri
